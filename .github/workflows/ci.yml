name: ci

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Backend tests
        run: python -m pytest -q
      - name: Contract schema determinism
        run: |
          python scripts/generate_contract4.py
          python scripts/generate_contract5.py
          git diff --exit-code -- contracts/contract_4.json contracts/contract_5.json
      - name: Example schema validation
        run: |
          python -c "
          import json, glob, os
          import jsonschema
          pairs = [('contracts/contract_4.json', 'contracts/contract_4_risk_api/examples/*.json'),
                   ('contracts/contract_5.json', 'contracts/contract_5_api_dashboard/examples/*.json')]
          n4 = {'vendor_risk': 'VendorRisk', 'audit_narrative': 'AuditNarrativeResponse'}
          n5 = {'risk_summary': 'RiskSummary', 'vendor_risk_view': 'VendorRiskView',
                'graph_view': 'GraphView', 'error': 'ErrorResponse'}
          for schema_path, pat in pairs:
              schema = json.load(open(schema_path))
              names = n4 if 'contract_4' in pat else n5
              for ex in sorted(glob.glob(pat)):
                  jsonschema.validate(json.load(open(ex)),
                      schema['definitions'][names[os.path.basename(ex).split('.')[0]]])
          print('all examples valid')
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t pramanagst-api .
      - run: docker build -t pramanagst-frontend ./frontend
