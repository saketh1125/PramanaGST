services:
  neo4j:
    image: neo4j:5.26
    container_name: pramanagst-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-pramanagst}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-pramanagst}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: pramanagst-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PRAMANAGST_ENV: ${PRAMANAGST_ENV:-prod}
      PRAMANAGST_DATA_DIR: /app/backend/ingestion/dataset/generated_data
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PRAMANAGST_API_KEY: ${PRAMANAGST_API_KEY:?Set PRAMANAGST_API_KEY in .env before starting}
      PRAMANAGST_USE_NEO4J: ${PRAMANAGST_USE_NEO4J:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pramanagst}
      PRAMANAGST_LLM_URL: ${PRAMANAGST_LLM_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRAMANAGST_LOG_LEVEL: ${PRAMANAGST_LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: pramanagst-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
